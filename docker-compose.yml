services:
  the_martian_call_postgres:
    image: postgres:16-alpine
    container_name: the_martian_call_db
    restart: always
    env_file:
      - .env
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 5s
      retries: 5
    volumes:
      - the_martian_call_db_data:/var/lib/postgresql/data
    networks:
      - default
      - monitor_network

  the-martian-call-server:
    container_name: the-martian-call-server
    build:
      context: .
      dockerfile: Dockerfile
      target: deploy
    restart: always
    env_file:
      - .env
    ports:
      - '${PORT:-3001}:3001'
    depends_on:
      the_martian_call_postgres:
        condition: service_healthy

volumes:
  the_martian_call_db_data:

networks:
  monitor_network:
    external: true
